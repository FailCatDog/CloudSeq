spring:
  application:
    name: flowseque
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowseque?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:flowseque}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

server:
  port: ${SERVER_PORT:19001}
  address: 0.0.0.0

collab:
  ws-url: ${COLLAB_WS_URL:ws://localhost:1234}
  jwt-secret: ${COLLAB_JWT_SECRET}
  token-expire-seconds: 600
  room-prefix: doc-
  internal-secret: ${COLLAB_INTERNAL_SECRET}

minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION:us-east-1}

dict:
  cache:
    redis-key: sm:dict
    ttl-days: 7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

document:
  asset:
    max-size-bytes: 10485760

export:
  max-document-chars: 100000
  max-sheet-cells: 50000
  max-embedded-image-bytes: 20971520
  external-image-enabled: true
  external-image-timeout-ms: 8000
  external-image-max-bytes: 10485760
