spring:
  datasource:
    url: jdbc:mysql://localhost:13306/feishu_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: cn.guet.feishu.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: feishu-secret-key-2024-very-long-secret-key-for-jwt-token
  expiration: 86400000

file:
  upload:
    path: E:/Code-Project/Java-Project/feishu/uploads
