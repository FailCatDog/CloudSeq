spring:
  application:
    name: soft_manage
  profiles:
    active: dev

server:
  port: 19001

collab:
  ws-url: ws://localhost:1234
  jwt-secret: soft_manage-collab-jwt-secret-change-me
  token-expire-seconds: 600
  room-prefix: doc-
  internal-secret: soft_manage-collab-internal-secret-change-me

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: workspace-docs
  region: us-east-1

office:
  document-server-url: http://localhost:8082
  callback-base-url: http://localhost:9001
  jwt-secret: soft_manage-onlyoffice-jwt-secret-change-me
  jwt-enabled: true
  download-token-expire-seconds: 3600
